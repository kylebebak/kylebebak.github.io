# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: "dronfelipe: posts"
email: kylebebak@gmail.com
description: > # this means to ignore newlines until "baseurl:"
  Blog about code and other stuff.
baseurl: "" # the subpath of your site, e.g. /blog
url: "http://kylebebak.github.io" # the base hostname & protocol for your site
github_username: kylebebak
# no date or extension in url
permalink: /post/:title
home: "https://dronfelipe.onrender.com"

# Build settings
markdown: kramdown
kramdown:
  input: GFM

exclude: [README.md, LICENSE, requirements.txt, Gemfile]

gems:
  - jekyll-sitemap
  - jekyll-seo-tag
